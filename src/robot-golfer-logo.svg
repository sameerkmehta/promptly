<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="70" y="40" width="60" height="50" rx="8" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  
  <!-- Antenna -->
  <line x1="100" y1="40" x2="100" y2="25" stroke="#2f5f5f" stroke-width="3"/>
  <circle cx="100" cy="22" r="4" fill="#2f5f5f"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="55" r="6" fill="#ffffff"/>
  <circle cx="115" cy="55" r="6" fill="#ffffff"/>
  <circle cx="85" cy="55" r="3" fill="#2f5f5f"/>
  <circle cx="115" cy="55" r="3" fill="#2f5f5f"/>
  
  <!-- Mouth -->
  <rect x="90" y="70" width="20" height="8" rx="2" fill="#1a4040"/>
  
  <!-- Body -->
  <rect x="65" y="90" width="70" height="60" rx="10" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  
  <!-- Chest detail -->
  <circle cx="100" cy="115" r="15" fill="none" stroke="#1a4040" stroke-width="2"/>
  <rect x="95" y="125" width="10" height="15" rx="2" fill="#1a4040"/>
  
  <!-- Arms -->
  <rect x="40" y="100" width="25" height="15" rx="7" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  <rect x="135" y="100" width="25" height="15" rx="7" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  
  <!-- Joints -->
  <circle cx="52" cy="107" r="5" fill="#1a4040"/>
  <circle cx="147" cy="107" r="5" fill="#1a4040"/>
  
  <!-- Golf Club -->
  <line x1="35" y1="107" x2="170" y2="60" stroke="#8b4513" stroke-width="4" stroke-linecap="round"/>
  <path d="M 165 55 Q 175 55 175 65 Q 175 75 165 75 L 160 70 Z" fill="#2f5f5f"/>
  
  <!-- Legs -->
  <rect x="75" y="150" width="15" height="30" rx="7" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  <rect x="110" y="150" width="15" height="30" rx="7" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  
  <!-- Feet -->
  <ellipse cx="82" cy="185" rx="12" ry="6" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  <ellipse cx="117" cy="185" rx="12" ry="6" fill="#2f5f5f" stroke="#1a4040" stroke-width="2"/>
  
  <!-- Golf Ball -->
  <circle cx="180" cy="180" r="8" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <circle cx="178" cy="178" r="1" fill="#cccccc"/>
  <circle cx="182" cy="178" r="1" fill="#cccccc"/>
  <circle cx="180" cy="182" r="1" fill="#cccccc"/>
  <circle cx="176" cy="180" r="1" fill="#cccccc"/>
  <circle cx="184" cy="180" r="1" fill="#cccccc"/>
</svg>